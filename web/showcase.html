<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="p3-base" content="{{BASE}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Hero Showcase · reference · XJet Atelier</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{{BASE}}/static/images/favicon-32.png">
    <link rel="preload" href="{{BASE}}/static/vendor/fonts/inter-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{BASE}}/static/vendor/fonts/cinzel-400-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{BASE}}/static/vendor/fonts.css">
    <link rel="stylesheet" href="{{BASE}}/static/showcase.css">
    <script src="{{BASE}}/static/metal.js"></script>
    <script src="{{BASE}}/static/showcase.js"></script>
    <!-- The homepage hero's showcase on its own, with review tools: the same engine (showcase.js) and the same
         story, so what is reviewed here is exactly what the hero shows. Not linked from the site, not indexed. -->
    <style>
        :root { --page: #F4F1EA; --ink: #1A1A1A; --muted: #6F6F6F; --gold: #C9A96E; --gold-deep: #B8873A; --gold-text: #8A6420; --line: #E8DDD0; --ivory: #FBF9F4; --sand: #F3EFE6; }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased; }
        button, select { font: inherit; }
        .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 14px 24px; background: #fff; border-bottom: 1px solid var(--line); }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
        .brand .x { font-family: 'Cinzel', serif; font-size: 20px; letter-spacing: .2em; font-weight: 600; }
        .brand .sep { width: 1px; height: 18px; background: #D8D0C2; }
        .brand .a { font-size: 12px; letter-spacing: .3em; color: var(--muted); }
        .pill { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; padding: 5px 10px; border-radius: 6px; background: #F1F7EC; color: #3F6B1F; border: 1px solid #CFE3BF; }
        .bar-tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
        .field { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
        .field select { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); padding: 7px 30px 7px 10px; border-radius: 8px; border: 1px solid #DCDCDC; background: #fff; min-height: 36px; }
        .seg { display: inline-flex; border: 1px solid #DCDCDC; border-radius: 9px; overflow: hidden; background: #fff; }
        .seg button { border: 0; background: transparent; padding: 8px 14px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); cursor: pointer; min-height: 36px; }
        .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
        main { max-width: 1180px; margin: 0 auto; padding: 28px 16px 56px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
        .stage-wrap { width: min(100%, 700px); }
        .stage-wrap.phone { width: min(100%, 390px); }
        .stage-wrap.off { position: absolute; left: -9999px; top: 0; opacity: 0; pointer-events: none; }   /* storyboard: kept for its filters */
        .timeline { width: min(100%, 700px); display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .timeline.phone { width: min(100%, 390px); }
        .seg-t { border: 0; background: none; padding: 6px 0 0; cursor: pointer; text-align: left; color: var(--muted); min-height: 36px; }
        .seg-t .bar-t { display: block; height: 3px; border-radius: 3px; background: #E3DACB; overflow: hidden; }
        .seg-t .bar-t::after { content: ''; display: block; height: 100%; width: calc(var(--fill, 0) * 100%); background: var(--gold); }
        .seg-t .lbl { display: block; margin-top: 7px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .seg-t.now .lbl { color: var(--ink); font-weight: 600; }
        .timeline.phone .lbl { display: none; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; }
        .btn { border: 1px solid #CFC6B8; background: #fff; color: var(--ink); border-radius: 10px; padding: 10px 18px; min-height: 40px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; }
        .btn:hover { border-color: var(--gold); }
        .notes { width: min(100%, 700px); background: #fff; border: 1px solid #EDE5D8; border-radius: 16px; padding: 18px 22px; font-size: 13px; line-height: 1.65; color: #4A4A4A; }
        .notes h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-text); }
        .notes ul { margin: 0; padding-left: 18px; }
        .notes b { color: var(--ink); font-weight: 600; }
        .board { width: min(100%, 1120px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .board.phone { width: min(100%, 390px); grid-template-columns: 1fr 1fr; }
        .frame { background: linear-gradient(160deg, var(--ivory), var(--sand)); border-radius: 16px; padding: 14px; box-shadow: 0 0 0 1px #EDE5D8; display: flex; flex-direction: column; gap: 10px; }
        .frame .cap { font-size: 12px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-text); }
        .frame .pic { aspect-ratio: 1; border-radius: 12px; background: #fff; overflow: hidden; display: grid; place-items: center; position: relative; }
        .frame .pic > img { width: 100%; height: 100%; object-fit: contain; padding: 6%; }
        .frame .quad, .frame .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; width: 100%; height: 100%; align-content: center; }
        .frame .quad img, .frame .pair img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 8px; box-shadow: 0 0 0 1px #F0EAE0; }
        .frame .quad .pk { box-shadow: 0 0 0 2px var(--gold); }
        .frame .quad.sel img:not(.pk) { opacity: .4; }
        .frame .txt { font-size: 14px; line-height: 1.5; padding: 14px; text-align: left; align-self: center; }
        .frame .sub { margin: 0; font-size: 13px; line-height: 1.45; color: #555; }
        .frame .nm { margin: 0; font-family: 'Cinzel', serif; font-size: 18px; }
        @media (max-width: 640px) { .bar { padding: 12px 16px; } .bar-tools { margin-left: 0; width: 100%; } .seg { display: none; } main { padding-top: 18px; } }
    </style>
</head>
<body>
    <header class="bar">
        <a class="brand" href="{{BASE}}/" title="XJet Atelier"><span class="x">XJET</span><span class="sep"></span><span class="a">ATELIER</span></a>
        <span class="pill">Reference · live on the homepage</span>
        <div class="bar-tools">
            <label class="field" for="pick">Design <select id="pick" aria-label="Gallery design the story is built from"></select></label>
            <div class="seg" role="group" aria-label="Preview size">
                <button type="button" data-frame="fit" aria-pressed="true">Fit</button>
                <button type="button" data-frame="phone" aria-pressed="false">Phone</button>
            </div>
        </div>
    </header>
    <main>
        <div class="stage-wrap" id="wrap"><div id="stage" role="img"></div></div>
        <div class="board" id="board" hidden></div>
        <div class="timeline" id="timeline" role="group" aria-label="Beats — tap one to jump there"></div>
        <div class="controls">
            <button type="button" class="btn" id="play">Pause</button>
            <button type="button" class="btn" id="replay">Watch again</button>
            <button type="button" class="btn" id="still">Storyboard</button>
            <button type="button" class="btn" id="motion" hidden>Play the sequence</button>
        </div>
        <section class="notes" aria-label="Notes for review">
            <h3>For review</h3>
            <ul id="notes"></ul>
        </section>
    </main>
    <script>
    (() => {
        const $ = id => document.getElementById(id);
        const narrow = window.matchMedia('(max-width: 640px)');
        const params = new URLSearchParams(location.search);
        let ctl = null, frameMode = 'fit', segs = [], still = params.has('still');
        const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const thumb = (u, w) => (u && u.includes('/assets/') ? u.replace('/assets/', '/thumb/') + '?w=' + w : u);

        function mount(design) {
            if (ctl) ctl.destroy();
            ctl = P3Showcase.mount($('stage'), { design, motion: 'always', loadingText: 'Loading the story…', emptyText: 'No gallery design has a full story yet.',
                                                 onFrame: tick, onReady: ready });
        }
        function ready(c) {
            const pick = $('pick'); pick.innerHTML = '';
            for (const x of c.choices) { const o = document.createElement('option'); o.value = x.slug; o.textContent = x.title; pick.appendChild(o); }
            pick.value = c.story.slug;
            const tl = $('timeline'); tl.innerHTML = '';
            segs = P3Showcase.labels.map((label, i) => {
                const s = document.createElement('button'); s.type = 'button'; s.className = 'seg-t'; s.title = P3Showcase.captions[i] || 'The finished ring';
                s.innerHTML = '<span class="bar-t"></span><span class="lbl"></span>'; s.querySelector('.lbl').textContent = label;
                s.addEventListener('click', () => ctl.seek(c.plan.start[i] + 1));
                tl.appendChild(s); return s;
            });
            const S = c.story, D = c.plan, notes = $('notes'); notes.innerHTML = '';
            const li = h => { const l = document.createElement('li'); l.innerHTML = h; notes.appendChild(l); };
            li('This is the homepage hero’s showcase on its own, with review tools — the same engine and the same story.');
            li(`<b>${esc(S.title)}</b> from the Inspiration Gallery: its own prompt, its first four options, the one chosen, `
               + (S.refine ? `the refinement “${esc(S.refine.text)}”, ` : '') + 'its real 360° movie (its last two seconds, as a small clip), then Silver and 18K Yellow Gold at the same angle and scale, and the finished ring in gold with its name. Nothing is generated or charged.');
            li(`About ${(D.total / 1000).toFixed(1)} s, muted, loops. It stops while it is off screen or the tab is hidden; visitors who prefer reduced motion see the finished ring, still.`);
            li('Choose another gallery design above, switch the preview to <b>Phone</b>, or open this page on a phone. The beats under the stage jump straight to a moment; <b>Storyboard</b> shows all seven at once.');
            if (still) showBoard();
        }
        function tick(st) {
            const D = ctl && ctl.plan; if (!D) return;
            segs.forEach((s, k) => { s.style.setProperty('--fill', k < st.beat ? 1 : k > st.beat ? 0 : Math.max(0, Math.min(1, (st.t - D.start[k]) / D.dur[k])).toFixed(3)); s.classList.toggle('now', k === st.beat); });
        }
        function setPlay(v) { if (v) ctl.play(); else ctl.pause(); $('play').textContent = v ? 'Pause' : 'Play'; }
        $('play').addEventListener('click', () => setPlay(!ctl.state().playing));
        $('replay').addEventListener('click', () => { ctl.restart(); $('play').textContent = 'Pause'; });

        function showBoard() {
            const S = ctl.story; if (!S) return;
            setPlay(false);
            $('wrap').classList.add('off'); $('timeline').hidden = true;
            for (const id of ['play', 'replay', 'still']) $(id).hidden = true;
            $('motion').hidden = false;
            const b = $('board'); b.hidden = false; b.innerHTML = '';
            const fr = (cap, inner, after = '') => { const f = document.createElement('div'); f.className = 'frame'; f.innerHTML = `<span class="cap"></span><div class="pic">${inner}</div>${after}`; f.querySelector('.cap').textContent = cap; b.appendChild(f); };
            const quad = sel => `<div class="quad${sel ? ' sel' : ''}">${S.options.map((u, i) => `<img src="${thumb(u, 320)}" alt="" class="${sel && i === S.picked ? 'pk' : ''}">`).join('')}</div>`;
            const silver = S.tone === 'gold' ? 'url(#sc-silver)' : 'none', gold = S.tone === 'gold' ? 'none' : 'url(#sc-gold)';
            const C = P3Showcase.captions;
            fr(C[0], `<p class="txt">✦ ${esc(S.prompt)}</p>`);
            fr(C[1], quad(false));
            fr(C[2], quad(true));
            fr(C[3], `<div class="pair"><img src="${thumb(S.options[S.picked], 320)}" alt=""><img src="${thumb(S.refine ? S.refine.image_url : S.options[S.picked], 320)}" alt=""></div>`, S.refine ? `<p class="sub">✦ ${esc(S.refine.text)}</p>` : '');
            fr(C[4], `<img src="${S.poster_url}" alt="">`);
            fr(C[5], `<div class="pair"><img src="${thumb(S.still_url, 320)}" alt="" style="filter:${silver}"><img src="${thumb(S.still_url, 320)}" alt="" style="filter:${gold}"></div>`, '<p class="sub">Silver · 18K Yellow Gold</p>');
            fr('The finished ring', `<img src="${thumb(S.still_url, 800)}" alt="" style="filter:${gold}">`, `<p class="nm">${esc(S.title)}</p><p class="sub">Designed with XJet Atelier</p>`);
        }
        $('still').addEventListener('click', () => { still = true; showBoard(); });
        $('motion').addEventListener('click', () => {
            still = false; $('board').hidden = true; $('wrap').classList.remove('off'); $('timeline').hidden = false;
            for (const id of ['play', 'replay', 'still']) $(id).hidden = false;
            $('motion').hidden = true; ctl.restart(); $('play').textContent = 'Pause';
        });

        function applyFrame() {
            const phone = frameMode === 'phone' || narrow.matches;
            $('wrap').classList.toggle('phone', phone); $('timeline').classList.toggle('phone', phone); $('board').classList.toggle('phone', phone);
            $('stage').classList.toggle('sc-phone', phone);
            document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.frame === frameMode)));
            if (ctl && ctl.plan) ctl.seek(ctl.state().t);
        }
        document.querySelectorAll('.seg button').forEach(x => x.addEventListener('click', () => { frameMode = x.dataset.frame; applyFrame(); }));
        (narrow.addEventListener ? narrow.addEventListener('change', applyFrame) : narrow.addListener(applyFrame));
        $('pick').addEventListener('change', e => {
            try { history.replaceState(null, '', location.pathname + '?design=' + encodeURIComponent(e.target.value)); } catch (_) {}
            mount(e.target.value);
        });
        // review tooling: jump to a moment and read the state
        window.__showcase = { seek: ms => ctl.seek(ms), pause: () => { setPlay(false); return ctl.state(); }, state: () => ctl.state(), get ctl() { return ctl; } };

        applyFrame();
        mount(params.get('design') || 'aurora-mesh');
    })();
    </script>
</body>
</html>
