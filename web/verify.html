<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>XJet Atelier — Email Verification</title>
  <link rel="stylesheet" href="{{BASE}}/static/vendor/fonts.css">
  <!-- Pipeline 2 templates/verify.html, ported. Body is rendered by p3/registration.py. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Helvetica, Arial, sans-serif;
      background: #FAF8F4; color: #2A2A2A;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #fff; color: #2A2A2A; max-width: 30rem; width: 100%;
      padding: 3rem 2.5rem; text-align: center; border: 1px solid #EDE8DF;
      border-top: 3px solid #C9A96E; box-shadow: 0 20px 50px rgba(154,114,48,0.12);
    }
    .eyebrow { text-transform: uppercase; letter-spacing: 0.25em; font-size: 10px; color: #C9A96E; font-weight: 700; margin-bottom: 0.75rem; }
    h1 { font-family: 'Cinzel', serif; font-weight: 600; font-size: 1.75rem; color: #1A1A1A; margin-bottom: 1rem; }
    p { font-size: 0.9rem; line-height: 1.65; color: #6F6F6F; margin-bottom: 1rem; }
    .token {
      display: inline-block; font-family: monospace; font-size: 2rem; font-weight: 700; color: #1A1A1A;
      letter-spacing: 0.6rem; border: 2px solid #C9A96E; background: #FAF8F4;
      padding: 1rem 1.5rem; margin: 1.25rem 0 0.5rem;
    }
    .btn {
      display: inline-block; margin-top: 1.75rem; text-decoration: none;
      background: linear-gradient(135deg, #C9A96E 0%, #B08040 100%); color: #1A1A1A;
      padding: 0.95rem 2rem; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 700;
    }
    .btn:hover { background: linear-gradient(135deg, #D4B97E 0%, #C9A96E 100%); }
    button.btn { border: 0; cursor: pointer; font-family: inherit; }
    /* The acceptance asked for again when the Terms changed after the sign-up (p3/registration.py terms_changed) */
    .accept { display: flex; gap: 0.75rem; align-items: flex-start; text-align: left; font-size: 0.9rem; line-height: 1.6;
              color: #2A2A2A; margin: 1.25rem 0 0.5rem; cursor: pointer; }
    .accept input { width: 1.15rem; height: 1.15rem; margin-top: 0.2rem; flex-shrink: 0; accent-color: #8A561B; }
    .accept a { color: #1A1A1A; }
    .note { text-align: left; font-size: 0.85rem; }
    .note.err { color: #B4443A; }
    .bad { border-top-color: #B4443A; }
    .bad h1 { color: #B4443A; }
  </style>
</head>
<body>
  <div class="card {{CARD_CLASS}}">
    <p class="eyebrow">XJet Atelier</p>
{{BODY}}
  </div>
</body>
</html>
