# XJet Atelier Pipeline 3 on proto — forwards http://proto/JewelryB2C3/ to tron.
# Installed to /etc/nginx/snippets/jewelryb2c3-proxy.conf and `include`d once from the proto
# server block in /etc/nginx/sites-available/jewelry-b2c (see deploy/proto/setup-proto.sh).
# Owned by the Pipeline 3 repo; Pipeline 2's routes are not touched.
#
# The full path (prefix included) is passed through unchanged: tron's nginx and the P3 app
# both expect /JewelryB2C3/... . P3 issues relative redirects, so the browser stays on proto.
#
# tron answers plain HTTP with a 308 to https://tron/... (its HTTPS policy since 2026-10-11), so proto talks HTTPS to
# it and verifies tron's certificate against the XJet Tron Internal Root CA (installed by setup-proto.sh). The visitor's
# own scheme travels as X-Forwarded-Scheme: tron's nginx rewrites X-Forwarded-Proto to its own (https), and the app needs
# the visitor's to decide the Secure cookie flag and HSTS (p3/adminauth.py BrowserScheme).

location ^~ /JewelryB2C3 {
    proxy_pass https://172.16.10.32;         # tron (IP: no resolver dependency at nginx start)
    proxy_ssl_server_name on;                # SNI "tron" ...
    proxy_ssl_name tron;                     # ... and the name checked in tron's certificate
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_trusted_certificate /etc/nginx/tls/xjet-tron-root-ca.crt;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse on;
    proxy_set_header Host              tron;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Scheme $scheme;   # the visitor's scheme on proto; tron passes it through unchanged
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
