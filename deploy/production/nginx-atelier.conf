# XJet Atelier in production — install to /etc/nginx/sites-available/atelier (symlink into sites-enabled).
# Two hosts, one app process: the customer site at the root of atelier.xjet3d.com; the Admin on
# admin.atelier.xjet3d.com only. The app itself answers the Admin, the developer API and the API docs only on
# P3_ADMIN_HOST (and not at all in production for the dev tools); the refusals below are defence in depth.
# TLS: put the certificate paths in (certbot: `certbot --nginx -d atelier.xjet3d.com -d admin.atelier.xjet3d.com`).

upstream xjet_atelier {
    server 127.0.0.1:8340;
    keepalive 16;
}

# Sign-in attempts are throttled here too (the app has its own limits): 10 per minute per address.
limit_req_zone $binary_remote_addr zone=atelier_login:1m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name atelier.xjet3d.com admin.atelier.xjet3d.com;
    return 301 https://$host$request_uri;
}

# ── the customer site ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name atelier.xjet3d.com;

    ssl_certificate     /etc/letsencrypt/live/atelier.xjet3d.com/fullchain.pem;      # ← adjust
    ssl_certificate_key /etc/letsencrypt/live/atelier.xjet3d.com/privkey.pem;        # ← adjust
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/atelier.access.log;
    error_log  /var/log/nginx/atelier.error.log;

    # Reference images are capped at 10 MB by the app; headroom for multipart overhead.
    client_max_body_size 20m;

    # Nothing of the Admin or the developer tools exists on the public host.
    location ~ ^/(admin|api/admin|dev|api/dev|docs|redoc|openapi\.json|showcase|api/showcase)(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://xjet_atelier;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }
}

# ── the Admin ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.atelier.xjet3d.com;

    ssl_certificate     /etc/letsencrypt/live/atelier.xjet3d.com/fullchain.pem;      # ← adjust (a SAN certificate)
    ssl_certificate_key /etc/letsencrypt/live/atelier.xjet3d.com/privkey.pem;        # ← adjust
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/atelier-admin.access.log;
    error_log  /var/log/nginx/atelier-admin.error.log;
    client_max_body_size 20m;

    # Optional: restrict the Admin to the office / VPN addresses (business decision; see the handoff document).
    # allow 203.0.113.0/24;
    # deny all;

    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/admin/login {
        limit_req zone=atelier_login burst=5 nodelay;
        proxy_pass http://xjet_atelier;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    location / {
        proxy_pass http://xjet_atelier;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 600s;             # Admin 3D downloads and exports take longer
    }
}
